<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="icon"><img src="assets/logo.png" alt="Logo del proyecto"></div>
                <span>Character Counter</span>
            </div>
        <button id="theme-toggle" class="theme-toggle">
        </button>
        </header>
    </div>
    
    <section class="hero">
        <h1>Analyze your text in real-time.</h1>
    </section>

    <section class="editor">
        <textarea placeholder="Escribi tu texto aquí..."></textarea>
    </section>
         
    <section class="options">
        <label>
            <input type="checkbox">
            Exclude Spaces
        </label>
        <label>
            <input type="checkbox">
            Set Character Limit
        </label>
    </section>
